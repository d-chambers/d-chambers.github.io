# Create documentation and deploy
name: BuildDeployDocs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cognitive-test/package-lock.json

      - name: Test and build Mental Check-In
        working-directory: cognitive-test
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          installation-dir: ${{ runner.temp }}/miniconda
          miniconda-version: 'latest'
          python-version: "3.10"
          activate-environment: derchambers
          environment-file: environment.yml

      - name: Install quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.56"
          tinytex: true

      - name: print quarto version
        run: |
          quarto --version

      - name: Render Quarto Project
        shell: bash -l {0}
        run: |
          quarto render .

      - name: Setup Pages
        uses: actions/configure-pages@v2

      - name: Add Mental Check-In to the Pages artifact
        run: |
          mkdir -p _site/cognitive-test
          cp -R cognitive-test/dist/. _site/cognitive-test/
          test -f _site/cognitive-test/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
